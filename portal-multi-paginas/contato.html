<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de contato</title>
</head>
<body>
        <header>
            <h1>Entre em contato com a Lr fitness</h1>
            <nav>
            <a href="index.html">Página Inical</a>
            <a href="planos.html">Tabela de planos</a>
            <a href="contato.html">Entre em contato</a>
            <a href="#unidades">Conheça nossas unidades</a>
            <a href="#sobre">Sobre</a>
            </nav>
        </header>
<br>
    <main>
        <section id="contato.html">
             <form action="#" method="POST">

                <fieldset>
                    <legend><b>1 - Informações Pessoais</b></legend>

                    <label for="campo-nome"> Nome Completo:</label><br>
                    <input type="text" name="nome_completo" id="campo-nome" placeholder="Informe seu nome"required
                        size="40"><br>

                          <label for="campo-email"> Email Pessoal:</label><br>
                    <input type="email" name="email_pessoal" id="campo-email" placeholder="Informe seu E-mail"required
                        size="40"><br>

                           <label for="campo-telefone"> telefone:</label><br>
                    <input type="tel" name="Telefone" id="telefone" placeholder="Informe seu Telefone"required><br>

                </fieldset>

                <fieldset>
                    <legend><b>2 - Preferências de Planos</b></legend>

                    <label for="campo-curso">Selecione o Plano desejado: </label><br>
                    <select name="selecao_curso" id="campo-curso" required>
                        <option value="">Selecione uma opção</option>
                        <option value="front">basico</option>
                        <option value="back">Fitness</option>
                        <option value="mobile">LrGold</option>
                    </select><br>
                    <label for="campo-observacao">Observações ou Duvidas</label><br>
                    <textarea name="observacoes_adicionais" id="campo-observacao" rows="4" cols="50"
                    placeholder="Informe aqui seus Suas duvidas ou interesse..."></textarea>

                </fieldset>
                <br><br>

                <button type="submit"><b>Confirmar meu cadastro</b></button>

                <button type="reset"><b>Limpar Formulário</b></button>
                
            </form>

        </section>

    </main>
</body>
</html>
